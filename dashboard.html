<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Jenka Project</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--p:#4f46e5;--ph:#4338ca;--bg:#f3f4f6;--c:#ffffff;--t:#1f2937;--ts:#6b7280;--b:#e5e7eb;--succ:#10b981;--warn:#f59e0b;--r:12px;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
    body{background:var(--bg);color:var(--t);line-height:1.5}
    .navbar{background:var(--c);padding:15px 20px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
    .nav-brand{font-weight:800;font-size:18px;color:var(--p)}
    .nav-links a{margin-left:15px;text-decoration:none;color:var(--ts);font-weight:600;font-size:14px;transition:color 0.2s}
    .nav-links a.active,.nav-links a:hover{color:var(--p)}
    .container{max-width:1100px;margin:20px auto;padding:0 20px}
    .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:30px}
    .card{background:var(--c);padding:20px;border-radius:var(--r);box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);border:1px solid var(--b)}
    .card-title{font-size:13px;color:var(--ts);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px}
    .card-value{font-size:28px;font-weight:800;color:var(--t)}
    
    .table-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
    .table-container{background:var(--c);border-radius:var(--r);box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);border:1px solid var(--b);overflow-x:auto;margin-bottom:40px}
    table{width:100%;border-collapse:collapse;min-width:850px}
    th,td{padding:15px 20px;text-align:left;border-bottom:1px solid var(--b);font-size:14px}
    th{background:#f9fafb;font-weight:600;color:var(--ts);text-transform:uppercase;font-size:12px;letter-spacing:0.5px}
    tr:hover{background:#f9fafb}
    .badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
    .badge-pending{background:#fef3c7;color:#d97706}
    .badge-paid{background:#d1fae5;color:#059669}
    
    .btn-action{background:var(--bg);border:1px solid var(--b);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;margin-right:5px;margin-bottom:5px;transition:all 0.2s}
    .btn-action:hover{background:var(--b)}
    .btn-copy{color:var(--p);border-color:var(--p);background:#e0e7ff}
    .btn-copy:hover{background:var(--p);color:#fff}
    .btn-del{color:#dc2626;border-color:#fca5a5;background:#fee2e2}
    .btn-del:hover{background:#ef4444;color:#fff}
    .btn-export{background:#10b981;color:#fff;border:none;padding:8px 15px;font-size:13px}
    .btn-export:hover{background:#059669}
    
    /* MODAL STYLES */
    .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
    .modal{background:#fff;padding:30px;border-radius:16px;width:100%;max-width:650px;max-height:90vh;overflow-y:auto}
    .modal h3{margin-bottom:20px;color:var(--t);border-bottom:1px solid var(--b);padding-bottom:10px}
    .modal-content{font-size:14px;color:var(--t);margin-bottom:20px;line-height:1.6}
    .btn-close{background:var(--t);color:#fff;border:none;padding:12px 15px;border-radius:8px;font-weight:600;cursor:pointer;width:100%;margin-top:10px}
    
    .section-title{font-size:13px;font-weight:700;color:var(--p);text-transform:uppercase;margin:20px 0 10px;border-bottom:2px solid #e5e7eb;padding-bottom:5px}
    .copy-block{background:#f9fafb;border:1px solid #e5e7eb;padding:15px;border-radius:8px;font-family:inherit;font-size:13px;white-space:pre-wrap;user-select:text}
    
    #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:1100}
    @media(max-width:600px){.summary-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>

  <div id="toast">Pesan disini</div>

  <div class="navbar">
    <div class="nav-brand">Jenka Admin</div>
    <div class="nav-links">
      <a href="/dashboard.html" class="active">Dashboard</a>
      <a href="/setting.html">Setting</a>
      <a href="#" onclick="logout()">Logout</a>
    </div>
  </div>

  <div class="container">
    <div class="summary-grid">
      <div class="card"><div class="card-title">Total Pesanan</div><div class="card-value" id="countTotal">0</div></div>
      <div class="card"><div class="card-title">Pesanan Dibayar</div><div class="card-value" id="countPaid">0</div></div>
      <div class="card"><div class="card-title">Total Pendapatan (Rp)</div><div class="card-value" id="countRevenue">0</div></div>
    </div>

    <div class="table-header">
      <h2 style="font-size:16px;color:var(--t);">Daftar Pesanan</h2>
      <button class="btn-action btn-export" onclick="exportCSV()">Export ke CSV</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr><th>ID Pesanan</th><th>Tanggal</th><th>Nama Pemesan</th><th>Total Bayar</th><th>Status</th><th width="260">Aksi</th></tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="6" style="text-align:center;">Memuat data pesanan...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Detail Pesanan -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <h3>Detail Pesanan <span id="modalOrderId"></span></h3>
      <div class="modal-content" id="modalContent"></div>
      <button class="btn-close" onclick="closeModal()">Tutup</button>
    </div>
  </div>

  <script>
    if (!localStorage.getItem('jenka_admin_token')) window.location.href = '/login.html';

    let ordersData = []; 
    let baseUrlPayment = 'https://domainanda.com/payment.html'; 

    function logout() { localStorage.removeItem('jenka_admin_token'); window.location.href = '/login.html'; }
    function showToast(msg) {
      const toast = document.getElementById('toast'); toast.textContent = msg; toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 3000);
    }

    async function fetchDashboardData() {
      try {
        const response = await fetch('/api/admin', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'get_dashboard_data' })
        });
        const result = await response.json();
        if (result.status === 'success') {
          ordersData = result.data.orders;
          baseUrlPayment = result.data.baseUrlPayment || baseUrlPayment;
          renderDashboard();
        } else document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" style="text-align:center;color:red;">Gagal: ${result.message}</td></tr>`;
      } catch (error) { document.getElementById('tableBody').innerHTML = `<tr><td colspan="6" style="text-align:center;color:red;">Error koneksi.</td></tr>`; }
    }

    function renderDashboard() {
      const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
      let countTotal = ordersData.length, countPaid = 0, countRevenue = 0;

      ordersData.slice().reverse().forEach((order, index) => {
        if (order.status === 'PAID') { countPaid++; countRevenue += order.totalBayar; }
        const badgeClass = order.status === 'PAID' ? 'badge-paid' : 'badge-pending';
        const rawIndex = ordersData.length - 1 - index; 

        tbody.innerHTML += `
          <tr>
            <td><strong>#${order.id}</strong></td>
            <td>${new Date(order.tanggal).toLocaleDateString('id-ID')}</td>
            <td>${order.nama} <br><small>${order.wa}</small></td>
            <td>Rp ${order.totalBayar.toLocaleString('id-ID')}</td>
            <td><span class="badge ${badgeClass}">${order.status}</span></td>
            <td>
              <button class="btn-action" onclick="showDetail(${rawIndex})">Detail</button>
              <button class="btn-action btn-copy" onclick="copyLink('${order.id}')">Copy Link</button>
              <button class="btn-action" onclick="changeStatus('${order.id}', '${order.status}')">Ubah Status</button>
              <button class="btn-action btn-del" onclick="deleteOrder('${order.id}')">Hapus</button>
            </td>
          </tr>
        `;
      });

      document.getElementById('countTotal').textContent = countTotal;
      document.getElementById('countPaid').textContent = countPaid;
      document.getElementById('countRevenue').textContent = 'Rp ' + countRevenue.toLocaleString('id-ID');
      if(ordersData.length === 0) tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Belum ada pesanan.</td></tr>`;
    }

    // TAMPILAN DETAIL RAPI & MUDAH DI-COPY
    function showDetail(index) {
      const order = ordersData[index];
      let html = `
        <table style="width:100%; font-size:13px; line-height:1.8; margin-bottom:15px; border-bottom:1px solid #e5e7eb; padding-bottom:10px;">
          <tr><td width="130"><strong>Kategori & Tipe</strong></td><td>: ${order.kategori} (${order.jenis})</td></tr>
          <tr><td><strong>Harga Dasar</strong></td><td>: Rp ${order.hargaDasar.toLocaleString('id-ID')}</td></tr>
          <tr><td><strong>Total Dibayar</strong></td><td>: Rp ${order.totalBayar.toLocaleString('id-ID')}</td></tr>
        </table>
      `;
      
      try {
        const d = JSON.parse(order.detailUndangan);
        if(!d.mempelai) throw new Error("Format Lama");

        let contentCopy = '';

        // 1. Mempelai
        contentCopy += `TEMA UNDANGAN: ${d.kode_tema || '-'}\n`;
        contentCopy += `URUTAN TAMPIL: ${d.mempelai.urutan.toUpperCase()}\n\n`;
        
        contentCopy += `[DATA MEMPELAI PRIA]\n`;
        contentCopy += `Nama Lengkap   : ${d.mempelai.pria.lengkap}\n`;
        contentCopy += `Nama Panggilan : ${d.mempelai.pria.panggilan}\n`;
        contentCopy += `Nama Orang Tua : ${d.mempelai.pria.ortu}\n`;
        contentCopy += `Akun Instagram : ${d.mempelai.pria.ig}\n\n`;

        contentCopy += `[DATA MEMPELAI WANITA]\n`;
        contentCopy += `Nama Lengkap   : ${d.mempelai.wanita.lengkap}\n`;
        contentCopy += `Nama Panggilan : ${d.mempelai.wanita.panggilan}\n`;
        contentCopy += `Nama Orang Tua : ${d.mempelai.wanita.ortu}\n`;
        contentCopy += `Akun Instagram : ${d.mempelai.wanita.ig}\n\n`;

        // 2. Acara
        contentCopy += `[RANGKAIAN ACARA]\n`;
        d.acara.forEach((ac, i) => {
          contentCopy += `Acara ${i+1} : ${ac.nama}\n`;
          contentCopy += `Tanggal : ${ac.tanggal}\n`;
          contentCopy += `Jam     : ${ac.jam}\n`;
          contentCopy += `Tempat  : ${ac.tempat}\n`;
          contentCopy += `Maps    : ${ac.maps}\n\n`;
        });

        // 3. Pelengkap
        const p = d.pelengkap;
        let colors = p.dresscode ? p.dresscode.join(', ') : '-';
        contentCopy += `[FITUR PELENGKAP]\n`;
        contentCopy += `RSVP          : ${p.rsvp}\n`;
        contentCopy += `WA Konfirmasi : ${p.wa_konfirmasi}\n`;
        contentCopy += `Musik/Lagu    : ${p.music}\n`;
        contentCopy += `Kode Warna    : ${colors}\n`;
        contentCopy += `Kustom Doa    : ${p.doa || '-'}\n`;
        contentCopy += `Turut Mengundang: \n${p.turut_mengundang || '-'}\n\n`;

        contentCopy += `[REKENING VIRTUAL GIFT]\n${p.rekening_gift}\n\n`;
        contentCopy += `[LOVE STORY]\n${p.love_story}\n`;

        html += `<div class="copy-block">${contentCopy}</div>`;
        html += `<p style="font-size:12px;color:var(--ts);margin-top:10px;text-align:center;">Blok seluruh teks di dalam kotak abu-abu di atas untuk menyalin data.</p>`;

      } catch(e) {
        html += `<div class="copy-block" style="border-color:#fca5a5;background:#fee2e2;color:#dc2626;">Format pesanan gagal diurai. Tampilan mentah:\n\n${order.detailUndangan}</div>`;
      }

      document.getElementById('modalOrderId').textContent = '#' + order.id;
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('detailModal').style.display = 'none'; }
    function copyLink(id) {
      const cleanBaseUrl = baseUrlPayment.replace(/\/$/, '');
      navigator.clipboard.writeText(`${cleanBaseUrl}?id=${id}`).then(() => showToast('Link pembayaran disalin!'));
    }

    // UBAH STATUS
    async function changeStatus(id, currentStatus) {
      const newStatus = currentStatus === 'PENDING' ? 'PAID' : 'PENDING';
      if(confirm(`Ubah status pesanan #${id} menjadi ${newStatus}?`)) {
        showToast('Memperbarui status...');
        try {
          const response = await fetch('/api/admin', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'update_status', payload: { orderId: id, status: newStatus } })
          });
          const result = await response.json();
          if(result.status === 'success') { showToast('Status diubah!'); fetchDashboardData(); } 
          else showToast('Gagal: ' + result.message);
        } catch(e) { showToast('Terjadi kesalahan koneksi.'); }
      }
    }

    // HAPUS PESANAN
    async function deleteOrder(id) {
      if(confirm(`PERINGATAN: Yakin ingin menghapus pesanan #${id} secara permanen? Data tidak dapat dikembalikan.`)) {
        showToast('Menghapus pesanan...');
        try {
          const response = await fetch('/api/admin', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'delete_order', payload: { orderId: id } })
          });
          const result = await response.json();
          if(result.status === 'success') { showToast('Pesanan berhasil dihapus!'); fetchDashboardData(); } 
          else showToast('Gagal: ' + result.message);
        } catch(e) { showToast('Terjadi kesalahan koneksi.'); }
      }
    }

    // EXPORT TO CSV
    function exportCSV() {
      if(ordersData.length === 0) return showToast('Tidak ada data untuk diexport');
      
      let csvContent = "data:text/csv;charset=utf-8,";
      csvContent += "ID Pesanan,Tanggal,Nama,WhatsApp,Kategori,Tipe,Total Bayar,Status\n";
      
      ordersData.forEach(o => {
        const tgl = new Date(o.tanggal).toLocaleDateString('id-ID');
        const row = `"#${o.id}","${tgl}","${o.nama}","${o.wa}","${o.kategori}","${o.jenis}","${o.totalBayar}","${o.status}"`;
        csvContent += row + "\n";
      });
      
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Pesanan_Jenka_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    window.onload = fetchDashboardData;
  </script>
</body>
</html>
